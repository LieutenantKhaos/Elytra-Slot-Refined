plugins {
    id 'java-library'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(project.java_version as int)

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

version = mod_version
group = mod_group_id

jar {
    manifest {
        attributes([
            'Specification-Title'   : mod_name,
            'Specification-Vendor'  : mod_author,
            'Specification-Version' : mod_version,
            'Implementation-Title'  : mod_name,
            'Implementation-Version': mod_version,
            'Implementation-Vendor' : mod_author,
        ])
    }
}

java {
    withSourcesJar()
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository { maven { url = uri('https://repo.spongepowered.org/repository/maven-public') } }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    // Trinkets Updated (eu.pb4:trinkets) — pb4's universal-jar fork, compiled against by the
    // common Trinkets compat and therefore needed by every module that compiles common sources.
    maven {
        name = 'Nucleoid'
        url = uri('https://maven.nucleoid.xyz/')
    }
}

processResources {
    var replaceProperties = [
        minecraft_version            : minecraft_version,
        minecraft_version_range      : minecraft_version_range,
        neoforge_version             : findProperty('neoforge_version') ?: '',
        neoforge_loader_version_range: findProperty('neoforge_loader_version_range') ?: '',
        fabric_loader_version        : findProperty('fabric_loader_version') ?: '',
        fabric_version               : findProperty('fabric_version') ?: '',
        mod_id                       : mod_id,
        mod_name                     : mod_name,
        mod_license                  : mod_license,
        mod_version                  : mod_version,
        mod_author                   : mod_author,
        mod_description              : mod_description,
    ]
    inputs.properties replaceProperties
    // Only the Fabric manifest is templated through processResources; the NeoForge manifest
    // lives in neoforge/src/main/templates and is expanded by its generateModMetadata task.
    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
