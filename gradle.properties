# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Minecraft
minecraft_version=26.2
minecraft_version_range=[26.2, 26.3)
neo_form_version=26.2-1
java_version=25

# NeoForge
# The build/dev version. Kept current: early 26.2 betas predate APIs that other
# mods (e.g. Curios) already call, which shows up as NoSuchMethodError at runtime.
neoforge_version=26.2.0.70
# What the shipped mods.toml requires — deliberately looser than the build version.
neoforge_version_range=[26.2,27)
neoforge_loader_version_range=[4,)

# Fabric
fabric_loader_version=0.19.3
fabric_version=0.152.1+26.2

# Soft-compat dependencies (all compileOnly, runtime-gated by isModLoaded checks)
trinkets_version=4.1.0-beta.1+26.2
curios_version=16.0.0+26.2
modmenu_version=20.0.0-beta.2
universal_graves_version=3.12.0+26.2

# Mod properties
mod_id=elytra_slot_refined
mod_name=Elytra Slot Refined
mod_version=1.0.0
mod_group_id=com.warwa.elytraslot
mod_license=All Rights Reserved
mod_author=LieutenantKhaos
mod_description=A modified elytra slot with vanilla-exact flight behavior.
