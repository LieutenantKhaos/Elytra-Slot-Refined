# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Minecraft
minecraft_version=26.3
minecraft_version_range=[26.3, 26.4)
neo_form_version=26.3-1
java_version=25

# NeoForge
# The build/dev version. Kept current: early 26.2 betas predate APIs that other
# mods (e.g. Curios) already call, which shows up as NoSuchMethodError at runtime.
neoforge_version=26.3.0.99
# What the shipped mods.toml requires — deliberately looser than the build version.
neoforge_version_range=[26.3,26.4)
neoforge_loader_version_range=[4,)

# Fabric
fabric_loader_version=0.20.1
fabric_version=0.165.0+26.3

# Soft-compat dependencies (all compileOnly, runtime-gated by isModLoaded checks)
trinkets_version=4.2.1+26.3
curios_version=17.0.0-beta.3+26.3
modmenu_version=21.0.0
universal_graves_version=3.13.0+26.3

# Mod properties
mod_id=elytra_slot_refined
mod_name=Elytra Slot Refined
mod_version=1.1.0-beta.1
mod_group_id=com.warwa.elytraslot
mod_license=MIT
mod_author=LieutenantKhaos
mod_description=A refined fork of Elytra Slot with a vanilla-integrated dedicated elytra slot that preserves chestplate use.
