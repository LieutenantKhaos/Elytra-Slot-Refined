plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

repositories {
    // Curios API (top.theillusivec4.curios) — NeoForge-only accessory mod.
    maven {
        name = 'Curios'
        url = uri('https://maven.theillusivec4.top/')
    }
}

dependencies {
    // Soft compat: Trinkets Updated (universal jar, runs on NeoForge too). Required here
    // because this module re-compiles the common sources that reference it.
    compileOnly "eu.pb4:trinkets:${trinkets_version}"

    // Soft compat: Curios. compileOnly, runtime-gated by ModList.isLoaded("curios").
    // The full jar rather than the :api classifier, because the soft mixin that fixes
    // shift-clicking out of the Curios slot has to reference Curios' own menu classes.
    // All Curios references live in this module — never in common.
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
}

neoForge {
    version = project.neoforge_version

    // Reference the single AT copy in the common module (it ships in the jar via
    // commonResources at the standard META-INF path — no duplicate file needed here).
    accessTransformers = project(':common').files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }

        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// The access widener is Fabric-only; keep it out of the NeoForge jar.
processResources {
    exclude 'elytraslot.accesswidener'
}

// Expand the mods.toml template (MDG-recommended pattern).
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version            : minecraft_version,
        minecraft_version_range      : minecraft_version_range,
        neoforge_version             : neoforge_version,
        neoforge_version_range       : neoforge_version_range,
        neoforge_loader_version_range: neoforge_loader_version_range,
        mod_id                       : mod_id,
        mod_name                     : mod_name,
        mod_license                  : mod_license,
        mod_version                  : mod_version,
        mod_author                   : mod_author,
        mod_description              : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
